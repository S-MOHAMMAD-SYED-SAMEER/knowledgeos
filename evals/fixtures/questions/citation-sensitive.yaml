# Questions with one precise, narrow numeric fact whose expected chunk is
# unambiguous -- these exist to test precision at the citation level, not
# just topical relevance. A retriever that returns a merely-related chunk
# from the same document (e.g. the wrong severity level, the wrong
# threshold) rather than the exact chunk containing the cited number should
# score a miss here, unlike in the "ambiguous" category where several
# chunks are genuinely, equally correct.

- id: cs001
  text: "Within how many minutes of declaring a severity-one incident must an executive be notified?"
  category: citation-sensitive
  expected_chunk_uids: ["f9cbee4e0939d52e95eebe93a063a85c"]
  expected_abstain: false
  filters: {}

