# Questions targeting the one document with two versions: the Production
# Database Access SOP. v1 (superseded) says seven days and one approving
# manager; v2 (active) says three days and two approving managers -- a
# materially changed answer, as the specification requires.
#
# Default retrieval (include_superseded: false) must answer from v2 only.
# The same questions with include_superseded: true may legitimately surface
# v1 as well, which is exactly what the "superseded versions in default
# retrieval: 0" gate (specification, acceptance gates) checks for.

