# The evaluation fixture corpus, pinned.
#
# chunk_uid = sha256(document_version_id : sequence : normalized_text)[:32]
# (app/chunking/uid.py) -- so a chunk_uid can only ever be reproduced if the
# document_id and version_id that produced it are the same ones every time.
# Every id below is therefore fixed, not generated at seed time. Generating
# them fresh on each run would make yesterday's expected_chunk_uids in the
# question set wrong today, for text that has not actually changed.
#
# `access-sop` is the one document with two versions: v1 is superseded by
# v2, which changes the approval and duration rules materially (seven days
# and one approver, versus three days and two approvers) -- the
# specification's own requirement for "a v2 of one of them with a
# materially changed answer".
#
# department/category here are the metadata this corpus seeds onto
# `documents` -- the same fields `RetrievalFilters` and the metadata-filter
# correctness metric read.

documents:
  - key: handbook
    document_id: 74973d26-c8bf-44b1-b0ce-a8df35ad2570
    title: Employee Handbook
    department: People
    category: Handbook
    tags: []
