# The chunking configuration this corpus must be seeded and re-seeded with.
# Pinned here rather than left to whatever KNOWLEDGEOS_CHUNK_SIZE_TOKENS an
# operator's environment happens to have set, because chunk_uid depends on
# it -- a different config would silently produce a different corpus with
# different chunk_uids than the ones frozen into the question set.
chunk_size_tokens: 512
chunk_overlap_tokens: 64
