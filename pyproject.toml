[project]
name = "knowledgeos"
version = "0.1.0"
description = "An internal knowledge system that answers from retrieved evidence — and measures whether it actually did."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Multipart form parsing. FastAPI refuses to define an UploadFile
    # route without it — it is a framework requirement for the upload
    # endpoint, not a convenience.
    "python-multipart>=0.0.20",
    # Milestone 3. PDF text and page count; pure Python, and on 3.13 it
    # brings no transitive dependencies of its own.
    "pypdf>=5.1",
    # The ingestion job runner polls for queued work. Durable across a
    # restart, which is what a job table needs and what an in-process
    # background task cannot give.
    "APScheduler>=3.10",
    # Milestone 4. The local embedding model named by the specification,
    # BAAI/bge-small-en-v1.5. It brings a large tree with it — torch,
    # transformers, tokenizers, numpy, scikit-learn, scipy — which is the
    # cost of running a model locally rather than calling an API.
    "sentence-transformers>=3.0",
    # SQLAlchemy integration for PostgreSQL's vector type. psycopg can carry
    # the type over raw SQL without this, but mapping the column in the ORM
    # cleanly is worth one small dependency over a hand-written
    # UserDefinedType. PostgreSQL + pgvector remains the only vector store.
    "pgvector>=0.3",
    # Milestone 7. The evaluation question set is specified as
    # `evals/fixtures/questions/*.yaml`. Already present transitively
    # (huggingface_hub and transformers both depend on it), but the
    # specification forbids undocumented dependencies, so it is declared
    # explicitly rather than relied on by accident.
    "PyYAML>=6.0",
    # Milestone 8. The generation provider for this build is Google Gemini,
    # not Anthropic — an explicit, documented deviation from the
    # specification's stack list (§3) and milestone-8 scope wording (§17);
    # see the README's milestone 8 section. `google-genai` is Google's
    # current SDK; the older `google-generativeai` package is superseded
    # and is not used. Imported lazily, only inside
    # `app/providers/gemini_llm.py`.
    "google-genai>=2.24",
    # Milestone 10. The server-rendered UI (`app/ui/`). Already present
    # transitively from milestone 4 onward (torch depends on it), but the
    # specification forbids undocumented dependencies (§18), so it is
    # declared explicitly now that this project actually imports it,
    # rather than relied on by accident the way `PyYAML` was before
    # milestone 7 declared it.
    "jinja2>=3.1",
]

# Dependencies arrive with the milestone that first imports them, so an
# install never carries a library the code does not yet use.
#
# pgvector is the PostgreSQL extension in m1 and the Python package in m4:
# the extension is created by migration 0001, and nothing in m1 declares a
# vector column, so there is nothing for the package to map yet.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
