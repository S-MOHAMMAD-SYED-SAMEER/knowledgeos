# The specification's own CI constraint, made literal (§16): "CI must
# pass with ANTHROPIC_API_KEY unset." Extended here to every external
# provider credential this project has ever named (Gemini, and, since
# neither is used, OpenAI) -- none is ever set, anywhere in this file.
#
# One job: install, migrate a real PostgreSQL+pgvector database, run the
# suite. No lint step, no build step, no deployment step -- locked
# decision D9 asks for a focused CI, not a second thing to maintain.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose.yml's own choice (locked decision D7):
        # a plain `postgres:16` image has no `CREATE EXTENSION vector`
        # to offer, and migration 0001 needs it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knowledgeos
          POSTGRES_PASSWORD: knowledgeos
          # The one database this job needs. pytest's own migration
          # fixtures (tests/conftest.py::alembic_config) refuse to run
          # against any database whose name does not end in `_test` --
          # the same safety rule that protects a developer's real
          # database locally protects this ephemeral one identically.
          POSTGRES_DB: knowledgeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledgeos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      KNOWLEDGEOS_DATABASE_URL: postgresql+psycopg://knowledgeos:knowledgeos@localhost:5432/knowledgeos_test
      KNOWLEDGEOS_TEST_DATABASE_URL: postgresql+psycopg://knowledgeos:knowledgeos@localhost:5432/knowledgeos_test
      # No ANTHROPIC_API_KEY, GEMINI_API_KEY, GOOGLE_API_KEY, or
      # OPENAI_API_KEY is set anywhere in this workflow -- the whole
      # suite must pass, and does, with none of them (specification
      # §16). Nothing here reads one.
      #
      # Forces huggingface_hub/sentence-transformers to fail fast
      # instead of reaching the network. CI must never download model
      # weights (locked decision D9): downloading BAAI/bge-small-en-v1.5
      # and cross-encoder/ms-marco-MiniLM-L-6-v2 fresh on every run
      # would make CI slow, network-dependent, and nondeterministic
      # about what "passing" means from one run to the next. With these
      # set, the real-model tests skip here exactly as they already do
      # in this project's own development sandbox
      # (tests/test_embeddings.py, tests/test_reranking.py) -- an
      # honest, reproducible skip, never a silent, uncontrolled
      # download.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create the project virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest
