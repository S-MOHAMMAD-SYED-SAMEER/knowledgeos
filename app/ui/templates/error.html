{% extends "base.html" %}
{% block title %}Error {{ status_code }} &mdash; KnowledgeOS{% endblock %}
{% block content %}
  <h1>Error {{ status_code }}</h1>
  <div class="error-box">
    <p>{{ detail }}</p>
  </div>
  {% if back_url %}
    <p><a href="{{ back_url }}">&larr; {{ back_label or "Back" }}</a></p>
  {% endif %}
{% endblock %}
