# Deterministic, curated demo answers for the five flagship scenarios
# (PROJECT_PLAN.md, P1) that together demonstrate the product goal chain:
#
#   retrieved correctly -> ranked correctly -> answered from evidence ->
#   cited correctly -> abstained when evidence is insufficient.
#
# Hand-written from the real evaluation fixture corpus
# (evals/fixtures/knowledge_base/), never generated by a live LLM -- a
# Gemini credential is unavailable in this environment and, per P1's
# scope, app/generation is not touched. Every `citations` id is a real
# chunk_uid present in demo/fixtures/embeddings.json; every `answer_text`
# was checked by hand against the cited chunk's actual text (see
# demo/generate_embeddings.py's `iter_manifest_chunks` for how to
# reproduce that text). `question` reuses the corresponding id's text
# from the frozen evaluation question set (evals/fixtures/questions/)
# verbatim, so the two fixtures key off the same ground truth.
#
# `sufficient_evidence` / `abstained` / `abstain_reason` mirror the field
# names and values `app/generation/abstention.py` already defines
# (`DEFAULT_ABSTENTION_TEXT`, `REASON_SUFFICIENT_EVIDENCE_FALSE`) for the
# one abstaining entry below, so a later milestone wiring this fixture
# into the UI has nothing to translate.

- id: da001
  question: "How many days per week may an employee work remotely?"
  scenario: "retrieved correctly"
  answer_text: >-
    Employees may work remotely up to three days per week with their
    manager's approval; some roles are fully remote by design and are not
    bound by this three-day figure.
  citations: ["5a04c330c14efaf8f4da83ebf6d6854f"]
  sufficient_evidence: true
  abstained: false
  abstain_reason: null

- id: cs001
  question: >-
    Within how many minutes of declaring a severity-one incident must an
    executive be notified?
  scenario: "cited correctly"
  answer_text: >-
    A severity-one incident -- a complete outage of a customer-facing
    service, or a confirmed data exposure -- requires executive
    notification within thirty minutes of declaration.
  citations: ["f9cbee4e0939d52e95eebe93a063a85c"]
  sufficient_evidence: true
  abstained: false
  abstain_reason: null

- id: cv001
  question: "How many days does standard production database access last for?"
  scenario: "ranked correctly"
  answer_text: >-
    Standard production database access is granted for three days and
    expires automatically at the end of that window. This is the current,
    active policy (version two of the SOP), which tightened an earlier
    seven-day grant after a security review.
  citations: ["da1cdb5e0e87ad69728e9d2781239d13"]
  sufficient_evidence: true
  abstained: false
  abstain_reason: null

- id: md001
  question: >-
    If I'm on call and need production database access during an active
    incident, what's the process, and does it require the same approval
    as a normal request?
  scenario: "answered from evidence"
  answer_text: >-
    During a declared incident, an on-call engineer may request
    break-glass access without waiting for the standard approval flow; it
    is granted immediately and logged automatically, with review by a
    security engineer the next business day. That is not the same
    approval a normal request needs: a standard, non-emergency request
    requires sign-off from the data owner and two engineering managers
    before access is granted.
  citations:
    - f9cbee4e0939d52e95eebe93a063a85c
    - da1cdb5e0e87ad69728e9d2781239d13
  sufficient_evidence: true
  abstained: false
  abstain_reason: null

- id: ie001
  question: >-
    What is the company's policy on using generative AI tools for writing
    code?
  scenario: "abstained when evidence is insufficient"
  answer_text: >-
    There is insufficient evidence in the retrieved documents to answer
    this question.
  citations: []
  sufficient_evidence: false
  abstained: true
  abstain_reason: sufficient_evidence_false
